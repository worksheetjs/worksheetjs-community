name: "🐛 Bug Report"
description: "Report a reproducible bug in a @worksheet-js/* package"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center">
          <img src="https://capsule-render.vercel.app/api?type=waving&color=0:0b1020,40:ef4444,100:7C3AED&height=160&section=header&text=Bug%20Report&fontSize=34&fontColor=ffffff&fontAlignY=38&desc=A%20clean%20repro%20unblocks%20everything&descAlignY=62&descSize=11&animation=fadeIn" alt="Bug Report" width="100%" />
        </p>

        <h3 align="center">
          <img src="https://api.iconify.design/lucide:bug.svg?color=%23ef4444&width=20" align="center" />
          &nbsp;Thanks for taking the time to file a bug report
        </h3>

        **Before you continue:**

        - <img src="https://api.iconify.design/lucide:search.svg?color=%237C3AED&width=14" align="center" /> &nbsp;[Search existing issues](https://github.com/worksheetjs/worksheetjs-community/issues?q=is%3Aissue) — duplicates slow everyone down.
        - <img src="https://api.iconify.design/lucide:flask-conical.svg?color=%23A855F7&width=14" align="center" /> &nbsp;Reproduce on the **latest** version of the affected package.
        - <img src="https://api.iconify.design/lucide:codesandbox.svg?color=%2322c55e&width=14" align="center" /> &nbsp;Share a minimal repro in [StackBlitz](https://stackblitz.com) or [CodeSandbox](https://codesandbox.io).

        > <img src="https://api.iconify.design/lucide:alert-triangle.svg?color=%23f59e0b&width=14" align="center" /> &nbsp;**Bugs without a reproduction are much harder to diagnose and may be closed.** If you can't share one, please ask in [Discussions → Q&A](https://github.com/worksheetjs/worksheetjs-community/discussions/categories/q-a) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and discussions and this is not a duplicate
          required: true
        - label: I am using the latest published version of the affected package
          required: true
        - label: This is a bug in a `@worksheet-js/*` package — not in my own app code
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/worksheetjs/worksheetjs-community/blob/main/CODE_OF_CONDUCT.md)
          required: true

  - type: markdown
    attributes:
      value: |
        <h3>
          <img src="https://api.iconify.design/lucide:package.svg?color=%237C3AED&width=18" align="center" />
          &nbsp;1 · Which package?
        </h3>

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Which package is the bug in?
      options:
        - "@worksheet-js/core"
        - "@worksheet-js/angular"
        - "@worksheet-js/react"
        - "@worksheet-js/vue"
        - "@worksheet-js/formula"
        - "@worksheet-js/excel"
        - "@worksheet-js/plugins"
        - "Multiple / not sure"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: "Run `npm view @worksheet-js/<name> version` or check your `package.json`."
      placeholder: "e.g. 2.4.1"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <h3>
          <img src="https://api.iconify.design/lucide:file-text.svg?color=%23A855F7&width=18" align="center" />
          &nbsp;2 · What's wrong?
        </h3>

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots and screen recordings welcome.
      placeholder: "When I call `sheet.insertRow()` after loading an XLSX file, the formulas in the row below are not recalculated…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Formulas in rows below the inserted row should update their references automatically."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <h3>
          <img src="https://api.iconify.design/lucide:flask-conical.svg?color=%2322c55e&width=18" align="center" />
          &nbsp;3 · Reproduction <sub><i>— the most important field</i></sub>
        </h3>

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Please provide **one** of:
          - A StackBlitz or CodeSandbox link
          - A minimal GitHub repo
          - A complete, self-contained code snippet

        Issues without a reproduction may be closed.
      placeholder: "https://stackblitz.com/edit/…"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <h3>
          <img src="https://api.iconify.design/lucide:laptop.svg?color=%23f59e0b&width=18" align="center" />
          &nbsp;4 · Environment
        </h3>

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - "React"
        - "Vue"
        - "Angular"
        - "Svelte"
        - "Vanilla JS / TS"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browser(s) affected
      multiple: true
      options:
        - "Chrome"
        - "Firefox"
        - "Safari"
        - "Edge"
        - "Mobile Safari (iOS)"
        - "Chrome Android"
        - "Not browser-specific"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.2, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Only if you're using SSR or a build step.
      placeholder: "e.g. 22.11.0"

  - type: markdown
    attributes:
      value: |
        <h3>
          <img src="https://api.iconify.design/lucide:terminal.svg?color=%237C3AED&width=18" align="center" />
          &nbsp;5 · Logs &amp; extra context
        </h3>

  - type: textarea
    id: logs
    attributes:
      label: Relevant console / error output
      description: Paste any error messages or stack traces. Will be rendered as a code block.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help — recent upgrades, unusual environments, feature flags, etc.

  - type: markdown
    attributes:
      value: |
        ---

        <p align="center">
          <sub>
            <img src="https://api.iconify.design/lucide:heart-handshake.svg?color=%23A855F7&width=14" align="center" />
            &nbsp;<b>Thanks!</b> We triage new bugs within 2 business days.
          </sub>
        </p>
