  - name: 💡 Share an idea / RFC
    url: https://github.com/worksheetjs/worksheetjs-community/discussions/categories/ideas
    about: "Early-stage ideas or architectural proposals — start a Discussion to gather feedback before opening a formal feature request."

  - name: 🙌 Show & Tell
    url: https://github.com/worksheetjs/worksheetjs-community/discussions/categories/show-and-tell
    about: "Built something cool with WorksheetJS? Share it with the community!"

  - name: 📚 Documentation
    url: https://worksheetjs.com/docs
